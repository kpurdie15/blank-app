name: Daily Morning Watchlist Email

on:
  schedule:
    # 11:17 AM UTC = 6:17 AM EST (UTC-5)
    - cron: "17 11 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-daily-digest]

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser yfinance

      - name: Run Script
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python emailer.py
